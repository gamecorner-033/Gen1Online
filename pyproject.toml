[project]
name = "gen1online"
version = "0.1.0"
description = "Gen1Online GTS & MMO server (Python side): server + migration tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
gen1online-server = "gen1online.server:run_server"
gen1online-migrate = "gen1online.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen1online"]